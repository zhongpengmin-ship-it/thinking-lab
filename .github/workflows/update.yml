name: Update Thinking Lab

on:
  workflow_dispatch:
  schedule:
    # 每天 00:00 UTC，即东八区约早上 8:00
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch latest content
        run: python scripts/update_news.py

      - name: Save daily update
        run: |
          git config user.name "thinking-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || git commit -m "Daily content update"
          git push
